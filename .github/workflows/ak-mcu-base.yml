# ak-mcu-base: host unit tests + simulator OTA test, and the STM32L151 build
# (both staging modes) with a bootloader size budget.
name: ak-mcu-base

on:
  push:
    paths: ['ak-mcu-base/**', '.github/workflows/ak-mcu-base.yml']
  pull_request:
    paths: ['ak-mcu-base/**', '.github/workflows/ak-mcu-base.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # ASan needs a smaller ASLR range than some runner kernels default to
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build
        run: cmake -S ak-mcu-base -B build/host && cmake --build build/host -j
      - name: Unit tests + simulator OTA
        run: ctest --test-dir build/host --output-on-failure

  stm32-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build (external + internal staging)
        run: |
          arm-none-eabi-gcc --version | head -1
          make -C ak-mcu-base stm32 stm32-internal
      - name: Size budget
        run: |
          cd ak-mcu-base/build
          ls -l stm32l151/boot.bin stm32l151/app.img stm32l151-internal/boot.bin stm32l151-internal/app.img
          # BOOT partition is 12288 B; keep 2K headroom for fixes in the field
          for f in stm32l151/boot.bin stm32l151-internal/boot.bin; do
            s=$(stat -c %s "$f"); echo "$f: $s B"
            [ "$s" -le 10240 ] || { echo "bootloader over the 10240 B budget"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ak-mcu-base-stm32l151
          path: |
            ak-mcu-base/build/stm32l151/boot.bin
            ak-mcu-base/build/stm32l151/app.img
            ak-mcu-base/build/stm32l151/*.elf
