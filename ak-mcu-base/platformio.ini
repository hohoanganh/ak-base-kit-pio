; ==============================================================================
; ak-mcu-base - PlatformIO (STM32L151CB, bare-metal, SPL reused from ../sources)
;
;   cd ak-mcu-base
;   pio run -e boot -t upload        ; bootloader @ 0x08000000
;   pio run -e app  -t upload        ; app (.elf already carries a valid header)
;   -> .pio/build/app/app.img        ; OTA image for tools/ak_fw.py
;
; NOTE: CMake is the reference build (verified in CI/cloud). This file mirrors
; port/stm32l151/port.cmake; keep both in sync when adding sources.
; ==============================================================================

[platformio]
default_envs = app
src_dir = .
boards_dir = ../boards

[common]
; OTA staging: 1 = external W25Qxx (APP 116K), 0 = internal flash (APP 58K).
; Read by pio_mcu_base.py as well (APP partition size for the linker check).
staging_external = 1
; 1 = AK Base Kit with an nRF24 module in the socket (holds its CSN, PB9, high)
kit_nrf24 = 0
; 1 = bootloader also runs an APP without image header (raw SWD flash, debug)
boot_allow_raw_app = 0
; SPL/CMSIS of the parent project (SPL sources are added by pio_mcu_base.py)
spl = ../sources/application/platform/stm32l/Libraries
app_version_flags =
    -DAPP_VER_MAJOR=1
    -DAPP_VER_MINOR=3
    -DAPP_VER_PATCH=7
    -DAPP_VER_BUILD=0

; sources shared by boot and app (kept here: [env] only accepts PlatformIO options)
src_filter_port =
    +<port/stm32l151/startup.c>
    +<port/stm32l151/port_stm32l151.c>
    +<port/stm32l151/system_stm32l1xx.c>
    +<port/stm32l151/spi_nor.c>
    +<common/*.c>
    +<services/fw/*.c>

; flags and sources of the app envs (Modbus role is added per env)
app_flags =
    -Iapp -Iservices/modbus -Ithird_party/nanomodbus -DNMBS_STRERROR_DISABLED
app_src_filter =
    -<*>
    ${common.src_filter_port}
    +<port/stm32l151/fw_header.c>
    +<port/stm32l151/rs485.c>
    +<kernel/src/*.c>
    +<services/sys/*.c>
    +<services/modbus/*.c>
    +<third_party/nanomodbus/*.c>
    +<app/*.c>

[env]
platform = ststm32
board = genericSTM32L151CB_bare
framework =
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = pre:pio_mcu_base.py

build_unflags = -std=gnu11 -std=gnu++11
build_flags =
    -std=gnu99
    -mcpu=cortex-m3 -mthumb -mfloat-abi=soft
    -Os -g -flto -ffunction-sections -fdata-sections
    -Wall -Wextra -Wno-unused-parameter
    -DUSE_STDPERIPH_DRIVER -DSTM32L1XX_MD
    ${common.app_version_flags}
    -DPORT_STAGING_EXTERNAL=${common.staging_external}
    -DPORT_KIT_NRF24_CSN=${common.kit_nrf24}
    -DBOOT_ALLOW_RAW_APP=${common.boot_allow_raw_app}
    -Ikernel/inc -Icommon -Ihal -Iservices/fw -Iservices/sys -Iboot -Iport/stm32l151
    -I${common.spl}/STM32L1xx_StdPeriph_Driver/inc
    -I${common.spl}/CMSIS/Device/ST/STM32L1xx/Include
    -I${common.spl}/CMSIS/Include

[env:boot]
board_build.ldscript = port/stm32l151/boot.ld
board_upload.maximum_size = 12288
build_flags = ${env.build_flags} -DAK_BOOTLOADER
build_src_filter =
    -<*>
    ${common.src_filter_port}
    +<boot/*.c>

[env:app]
; sample app, Modbus SLAVE on RS485 (register map + firmware update over RS485)
board_build.ldscript = port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_SLAVE -DNMBS_CLIENT_DISABLED
build_src_filter = ${common.app_src_filter}

[env:app_mbmaster]
; same app, Modbus MASTER (shell: mb read / mb write). One RS485 port, one role.
board_build.ldscript = port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_MASTER -DNMBS_SERVER_DISABLED
build_src_filter = ${common.app_src_filter}

[env:demo]
; AK Base Kit demo on top of the slave app: menu, clock, six games, 3D, maze,
; jukebox, video from the SPI flash, weather station, system monitor on the
; OLED + 3 buttons + buzzer + SHT45 (demo/, port/stm32l151/kit.c)
board_build.ldscript = port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_SLAVE -DNMBS_CLIENT_DISABLED
    -DAPP_KIT_DEMO -Idemo
build_src_filter = ${common.app_src_filter}
    +<demo/*.c>
    +<port/stm32l151/kit.c>
