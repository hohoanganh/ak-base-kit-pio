<text x="48.0" y="96.0" fill="#8d9bab" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="400" text-anchor="start">Mọi thứ phía trên lớp HAL không biết mình đang chạy trên chip nào</text>
