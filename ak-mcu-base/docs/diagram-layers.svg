<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
<title id="t">Một mã nguồn, ba nơi chạy</title><desc id="d">Các lớp của ak-mcu-base: ứng dụng và demo, kernel và dịch vụ, lớp HAL; bên dưới là ba port: chip STM32L151, máy tính để chạy unit test, và trình duyệt bằng WebAssembly.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d9bab"/></marker></defs>
<rect width="1280" height="640" fill="#0b0f14"/>
