<text x="643.0" y="280.5" fill="#8d9bab" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle">kernel/: task, message, timer   ·   services/: cập nhật firmware, nhật ký sự cố, Modbus</text>
