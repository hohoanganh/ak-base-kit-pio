<text x="1045.7" y="553.5" fill="#8d9bab" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle">→ WebAssembly, chạy thử không cần kit</text>
