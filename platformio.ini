; ==============================================================================
; PlatformIO config - AK Base Kit STM32L151CBT6 (EPCB firmware source base)
; ==============================================================================
; Port tu Makefile goc cua ak-base-kit-stm32l151 (application/Makefile +
; boot/Makefile), theo mo hinh da chay on dinh cua Smart-PDU-firmware:
;   - Khong dung framework PlatformIO nao (bare-metal, framework rong).
;   - SPL + CMSIS Device ST STM32L1xx da duoc VENDOR ngay trong
;     sources/{application,boot}/platform/stm32l/Libraries/ -> build khong
;     phu thuoc mang/registry khi da co platform ststm32 + toolchain.
;   - Startup/linker script tu viet (ak.ld co san ENTRY(reset_handler)).
;
; Memory map (giu nguyen AK base kit):
;   boot : 0x08000000, 8K   (sources/boot/platform/stm32l/ak.ld)
;   BSF  : 0x08002000, 4K   (boot share data flash)
;   app  : 0x08003000, 116K (sources/application/platform/stm32l/ak.ld)
;
; Build:  pio run -e app      /  pio run -e boot
; Nap:    pio run -e app -t upload   /  pio run -e boot -t upload
; Clean:  pio run -t clean
; ==============================================================================

[platformio]
default_envs = app
src_dir = sources
; Du an nam trong thu muc dong bo OneDrive - build artifact (hang nghin file
; .o) de bi OneDrive khoa file giua chung ("ar.exe: unable to rename ...:
; Permission denied" - da gap that o du an Smart-PDU). Chuyen build_dir ra
; TEMP de tranh loi va build nhanh hon.
build_dir = ${sysenv.TEMP}/pio_build_ak_base_kit

[env]
platform = ststm32
board = genericSTM32L151CB_bare
framework =
extra_scripts =
    pio_build_flags.py
    pio_copy_release.py
upload_protocol = stlink
monitor_speed = 115200

build_unflags =
    -std=gnu++11
    -std=gnu11
    -fpermissive

; Co chung cho ca C va C++ (khop COMPILER_FLAGS + GENERAL_FLAGS Makefile goc).
; Co rieng tung ngon ngu (-std=gnu99 / -std=gnu++11 -fno-rtti...) va co cho
; buoc LINK (-nostartfiles, nano.specs...) nam trong pio_build_flags.py vi
; build_flags cua PlatformIO chi vao CCFLAGS (bien dich chung).
build_flags =
    -march=armv7-m
    -mthumb
    -mfloat-abi=soft
    -g
    -ffunction-sections
    -fdata-sections
    -Wall
    -Wno-missing-field-initializers
    ; --- dinh nghia he thong (application/Makefile + boot/Makefile goc) ---
    -DUSE_STDPERIPH_DRIVER
    -DSTM32L1XX_MD
    -DSYS_CONSOLE_BAUDRATE=115200
    -DAPP_START_ADDR=0x08003000
    -DLOGIN_PRINT_EN
    -DSYS_PRINT_EN
    -DAPP_PRINT_EN
    -DSYS_DBG_EN
    -DAPP_DBG_EN
    -Wl,--gc-sections

; ------------------------------------------------------------------------------
; env:app - firmware ung dung (nap o 0x08003000, sau bootloader)
; ------------------------------------------------------------------------------
[env:app]
board_build.ldscript = sources/application/platform/stm32l/ak.ld

build_flags =
    ${env.build_flags}
    -Os
    -DAPP_TITLE=\"ak-base-kit-stm32l151-app\"
    -DAPP_VERSION=\"1.0.0\"
    ; --- tuy chon bat/tat module (khop application/Makefile goc) ---
    ; Bat: link UART, modbus master, OLED SSD1309. Tat (khong define):
    ; TASK_ZIGBEE_EN, IF_NETWORK_NRF24_EN, SH1106_DRIVER_EN, RELEASE,
    ; AK_IO_IRQ_ANALYZER, USING_USB_MOD, RTOS_DEV_EN.
    -DIF_LINK_UART_EN
    -DTASK_MBMASTER_EN
    -DSSD1309_DRIVER_EN
    -DAPP_DBG_SIG_EN
    -DSTM32L_PLATFORM
    -DUSE_EXTERNAL_FLASH
    ; --- cau hinh kernel AK (sources/ak/ak.cfg.mk goc) ---
    -DAK_COMMON_MSG_POOL_SIZE=8
    -DAK_COMMON_MSG_DATA_SIZE=64
    -DAK_PURE_MSG_POOL_SIZE=32
    -DAK_DYNAMIC_MSG_POOL_SIZE=8
    -DAK_TIMER_POOL_SIZE=16
    -DAK_TASK_OBJ_LOG_ENABLE
    ; --- include path (tinh tu thu muc goc project, KHONG phai src_dir) ---
    -Isources/application/ak/inc
    -Isources/application/app
    -Isources/application/app/screens
    -Isources/application/common
    -Isources/application/common/container
    -Isources/application/driver/Adafruit_oled_drv
    -Isources/application/driver/AsyncDelay/src
    -Isources/application/driver/button
    -Isources/application/driver/buzzer
    -Isources/application/driver/eeprom
    -Isources/application/driver/flash
    -Isources/application/driver/gpio
    -Isources/application/driver/led
    -Isources/application/libraries/ArduinoJson
    -Isources/application/libraries/ArduinoJson/src
    -Isources/application/libraries/nlohmann
    -Isources/application/libraries/QRCode/src
    -Isources/application/networks/net/link
    -Isources/application/networks/net/link/hal
    -Isources/application/networks/mbmaster-v2.9.6/mbmaster/udp
    -Isources/application/networks/mbmaster-v2.9.6/mbmaster/ascii
    -Isources/application/networks/mbmaster-v2.9.6/mbmaster/tcp
    -Isources/application/networks/mbmaster-v2.9.6/mbmaster/rtu
    -Isources/application/networks/mbmaster-v2.9.6/mbmaster/include
    -Isources/application/networks/mbmaster-v2.9.6/mbmaster/include/common
    -Isources/application/networks/mbmaster-v2.9.6/mbmaster/include/internal
    -Isources/application/networks/mbmaster-v2.9.6/demo/STM32/Port
    -Isources/application/sys
    -Isources/application/platform/stm32l
    -Isources/application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/inc
    -Isources/application/platform/stm32l/Libraries/CMSIS/Device/ST/STM32L1xx/Include
    -Isources/application/platform/stm32l/Libraries/CMSIS/Include
    -Isources/application/platform/stm32l/arduino/cores
    -Isources/application/platform/stm32l/arduino/cores/stm32
    -Isources/application/platform/stm32l/arduino/libraries/SPI
    -Isources/application/platform/stm32l/arduino/libraries/Wire
    -Isources/application/platform/stm32l/arduino/libraries/Wire/utility

; Danh sach source khop tung Makefile.mk goc (tinh tu src_dir = "sources").
; task_zigbee.cpp bi loai vi TASK_ZIGBEE_EN tat trong Makefile goc.
build_src_filter =
    -<*>
    +<application/ak/src/*.c>
    +<application/app/*.cpp>
    -<application/app/task_zigbee.cpp>
    +<application/app/screens/*.cpp>
    +<application/common/*.c>
    +<application/common/*.cpp>
    +<application/common/container/*.c>
    +<application/driver/Adafruit_oled_drv/*.cpp>
    +<application/driver/button/*.c>
    +<application/driver/buzzer/*.c>
    +<application/driver/eeprom/*.cpp>
    +<application/driver/flash/*.c>
    +<application/driver/gpio/*.c>
    +<application/driver/led/*.c>
    +<application/libraries/QRCode/src/*.c>
    +<application/sys/*.c>
    +<application/networks/net/link/*.cpp>
    +<application/networks/net/link/hal/*.cpp>
    +<application/networks/mbmaster-v2.9.6/mbmaster/mbm.c>
    +<application/networks/mbmaster-v2.9.6/mbmaster/common/mbutils.c>
    +<application/networks/mbmaster-v2.9.6/mbmaster/udp/*.c>
    +<application/networks/mbmaster-v2.9.6/mbmaster/ascii/*.c>
    +<application/networks/mbmaster-v2.9.6/mbmaster/tcp/*.c>
    +<application/networks/mbmaster-v2.9.6/mbmaster/rtu/*.c>
    +<application/networks/mbmaster-v2.9.6/mbmaster/functions/*.c>
    +<application/networks/mbmaster-v2.9.6/demo/STM32/Port/*.c>
    +<application/platform/stm32l/*.c>
    +<application/platform/stm32l/*.cpp>
    +<application/platform/stm32l/*.s>
    +<application/platform/stm32l/arduino/cores/*.cpp>
    +<application/platform/stm32l/arduino/cores/stm32/*.c>
    +<application/platform/stm32l/arduino/libraries/SPI/*.cpp>
    +<application/platform/stm32l/arduino/libraries/Wire/*.cpp>
    +<application/platform/stm32l/arduino/libraries/Wire/utility/*.cpp>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_gpio.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_rcc.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_usart.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_spi.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/misc.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_exti.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_syscfg.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_tim.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_adc.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_rtc.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_pwr.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_flash.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_iwdg.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_comp.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_dac.c>
    +<application/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_i2c.c>

; ------------------------------------------------------------------------------
; env:boot - bootloader (nap o 0x08000000, 8K)
; ------------------------------------------------------------------------------
[env:boot]
board_build.ldscript = sources/boot/platform/stm32l/ak.ld

build_flags =
    ${env.build_flags}
    -O2
    -DAPP_TITLE=\"ak-base-kit-stm32l151-boot\"
    -DAPP_VERSION=\"1.0.0\"
    -DRELEASE
    -DSTM32L_PLATFORM_BOOT
    -Isources/boot/app
    -Isources/boot/common
    -Isources/boot/driver/led
    -Isources/boot/driver/flash
    -Isources/boot/driver/eeprom
    -Isources/boot/sys
    -Isources/boot/platform/stm32l
    -Isources/boot/platform/stm32l/arduino
    -Isources/boot/platform/stm32l/arduino/SPI
    -Isources/boot/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/inc
    -Isources/boot/platform/stm32l/Libraries/CMSIS/Device/ST/STM32L1xx/Include
    -Isources/boot/platform/stm32l/Libraries/CMSIS/Include

build_src_filter =
    -<*>
    +<boot/app/*.cpp>
    +<boot/common/*.c>
    +<boot/driver/led/*.c>
    +<boot/driver/flash/*.c>
    +<boot/driver/eeprom/*.cpp>
    +<boot/sys/*.c>
    +<boot/platform/stm32l/*.c>
    +<boot/platform/stm32l/arduino/*.cpp>
    +<boot/platform/stm32l/arduino/SPI/*.cpp>
    +<boot/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_gpio.c>
    +<boot/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_rcc.c>
    +<boot/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_usart.c>
    +<boot/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_spi.c>
    +<boot/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/misc.c>
    +<boot/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_exti.c>
    +<boot/platform/stm32l/Libraries/STM32L1xx_StdPeriph_Driver/src/stm32l1xx_syscfg.c>
