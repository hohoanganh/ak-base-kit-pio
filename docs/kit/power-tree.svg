<text x="48.0" y="486.0" fill="#8d9bab" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" text-anchor="start">Pin CR1220 chỉ nuôi RTC khi mất nguồn. Bo không có đường nguồn nào khác ngoài USB Type-C.</text>
