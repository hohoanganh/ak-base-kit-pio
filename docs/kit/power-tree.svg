<text x="146.0" y="309.5" fill="#8d9bab" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle">5V · tối đa 1 A</text>
<rect x="290" y="250" width="190" height="80" rx="8" fill="#111821" stroke="#7c8a9a" stroke-width="1.5"/>
