<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
<title id="t">Cây nguồn</title><desc id="d">Cây nguồn: USB Type-C 5V qua cầu chì và diode thành đường 5V; LDO RT9013 tạo 3V3 cho vi điều khiển và các IC; mạch tăng áp TPS61040 tạo 12,5V cho màn hình OLED; còi dùng 5V.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d9bab"/></marker></defs>
